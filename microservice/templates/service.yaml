apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}
spec:
  selector:
    app: {{ include "service.fullname" . }}
  {{- with .Values.service }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .targetPort }}

      {{- with .name }}
      name: {{ . }}
      {{- end }}

      {{- with .nodePort }}
      nodePort: {{ . }}
      {{- end }}
  type: {{ .type }}
  {{- end }}