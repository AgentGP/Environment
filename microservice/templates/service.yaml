apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}
spec:
  selector:
    app: {{ include "service.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  type: {{ .Values.service.type }}
