{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}
spec:
  parentRefs:
    - name: traefik-gateway
  hostnames:
    - "{{ include "service.fullname" . }}.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "service.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}