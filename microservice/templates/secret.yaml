{{- $dict := merge dict
  .Values.environment.secret 
  .Values.global.environment.secret }}
{{- if not (empty $dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.fullname" . }}-secret
data:
  {{- range $name, $value := $dict }}
  {{ $name }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}