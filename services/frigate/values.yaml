# Wrapper-chart route (templates/httpRoute.yaml), same pattern as joplin
httpRoute:
  enabled: true
  hostname: frigate.localhost
  port: 8971 # "http-auth" port: Frigate UI with login. 5000 is the unauthenticated internal port.

frigate:
  # Frigate config (rendered into a ConfigMap, mounted read-only at /config/config.yml)
  config: |
    mqtt:
      enabled: false

    # Port 8971 (login-protected UI) serves plain HTTP; Traefik in front handles the edge.
    tls:
      enabled: false

    detectors:
      cpu1:
        type: cpu

    cameras:
      # Placeholder so the config validates. Replace the path with your real
      # camera's RTSP URL and set enabled: true.
      intercom:
        enabled: true
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@192.168.68.123:554
              roles:
                - record
        detect:
          width: 1280
          height: 720
          fps: 5
