{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "frigate.fullname" . }}
spec:
  parentRefs:
    - name: traefik-gateway
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "frigate.fullname" . }}
          port: {{ .Values.httpRoute.port }}
{{- end }}
